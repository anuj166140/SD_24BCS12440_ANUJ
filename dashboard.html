<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
</head>
<body>

<nav class="navbar">
    <h2>Student Portal</h2>
    <a href="leave.html" class="btn">Apply Leave</a>
</nav>

<div class="container">

    <div class="profile-card tilt">
        <h2>Anuj Rajput</h2>
        <p>UID: 24BCS12440 | Section: 707-A | Semester: 4</p>
        <p id="overallText"></p>
        <span id="riskBadge" class="badge"></span>
    </div>

    <h3 class="section-title">Subjects</h3>

    <div class="subject-grid">

        <div class="subject-card tilt">
            <canvas id="dsaChart"></canvas>
            <p>DSA</p>
        </div>

        <div class="subject-card tilt">
            <canvas id="oopsChart"></canvas>
            <p>OOPS</p>
        </div>

        <div class="subject-card tilt">
            <canvas id="mathChart"></canvas>
            <p>Math</p>
        </div>

        <div class="subject-card tilt">
            <canvas id="mlChart"></canvas>
            <p>ML</p>
        </div>

    </div>

    <h3 class="section-title">Academic Calendar</h3>
    <div id="calendar"></div>

</div>

<script src="script.js"></script>
</body>
</html>
