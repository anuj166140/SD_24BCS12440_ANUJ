<!DOCTYPE html>
<html>
<head>
    <title>Apply Leave</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <a href="dashboard.html" class="btn">⬅ Back</a>
    <h2>Leave Portal</h2>
    <div></div>
</nav>

<div class="leave-container">

    <div class="leave-section tilt">
        <h3>Select Leave Type</h3>
        <div class="leave-types">
            <div class="leave-card">Duty Leave</div>
            <div class="leave-card">Medical Leave</div>
            <div class="leave-card">Family Leave</div>
        </div>
    </div>

    <div class="leave-section tilt">
        <h3>Leave Duration</h3>
        <label>Start Date</label>
        <input type="date" id="startDate">
        <br><br>
        <label>End Date</label>
        <input type="date" id="endDate">
    </div>

    <div class="leave-section tilt">
        <h3>Reason</h3>
        <textarea id="reason" rows="4"></textarea>
    </div>

    <div class="leave-section tilt">
        <button onclick="submitLeave()" class="btn full">Submit Leave</button>
        <div id="leavePreview"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
